name: Update Claude Skills

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update skills
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh skills update --all

      - name: Create pull request if changes exist
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update Claude skills'
          title: 'chore: update Claude skills'
          body: |
            Automated update of Claude skills via `gh skills update --all`.
          branch: chore/update-claude-skills
          delete-branch: true
          base: main
